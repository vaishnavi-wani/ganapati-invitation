<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>गणपती बाप्पा मोरया 🙏</title>

    <link rel="stylesheet" href="style.css">

    <!-- Marathi Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="invitation home-page">

        <!-- Decorative Top -->
        <div class="top-decoration">
            ✦ ───────── ✦
        </div>

        <p class="mantra">
            ॥ श्री गणेशाय नमः ॥
        </p>

        <p class="welcome">
            सप्रेम आमंत्रण
        </p>

        <!-- Bappa Image -->
        <div class="ganpati">
            <img src="bappa.jpg" alt="श्री गणपती बाप्पा">
        </div>

        <h1>
            गणपती बाप्पा मोरया!
        </h1>

        <div class="small-divider">
            ❁
        </div>

        <p class="message">
            बाप्पांच्या आगमनाने
            <br>
            <strong>आमचे घर आनंदाने आणि भक्तीने भरून गेले आहे.</strong>
        </p>

        <div class="flowers">
          🌸 &nbsp; ✨ &nbsp; 🌺 &nbsp; ✨ &nbsp; 🌸
        </div>

        <p class="invite-line">
            बाप्पांच्या दर्शनासाठी
            <br>
            आपली प्रेमळ उपस्थिती लाभावी,
            <br>
            हीच मनापासून इच्छा. 🙏
        </p>

        <!-- Next Page Button -->
       <a href="invitation.html" class="button">
    बाप्पांच्या दर्शनासाठी पुढे चला →
      </a>

        <div class="bottom-decoration">
            ✦ ───────── ✦
        </div>

    </div>

</body>

</html>
